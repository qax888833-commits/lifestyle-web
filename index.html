<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활습관 기록</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1f24;--sub:#6b7280;--pri:#3b6cf6;--ok:#16a34a;--warn:#e11d48;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e26;--tx:#eceef2;--sub:#9aa1ae;--bd:#2c303b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:20px;margin:8px 0 14px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:12px;background:var(--pri);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.on{background:var(--warn)}
button.small{padding:4px 8px;font-size:12px}
input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.sub{color:var(--sub);font-size:13px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.stat:last-child{border:0}
.sessbox{margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)}
.sess{font-size:13px;color:var(--sub);padding:2px 0}
.sess .note{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bd)}
th{color:var(--sub);font-weight:500}
#result{white-space:pre-wrap;font-size:14px}
.goals{list-style:none;margin:0 0 10px;padding:0}
.goals li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.goals input[type=checkbox]{width:22px;height:22px;padding:0;flex:none}
.goals .t{flex:1;word-break:break-all}
.goals li.done .t{text-decoration:line-through;color:var(--sub)}
.goals button.x{padding:2px 8px;background:transparent;color:var(--sub);font-size:18px}
dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>
<body>
<main>
<h1>🌙 생활습관 기록 <span class="sub" id="today"></span></h1>

<div class="card">
  <h2>내 목표 <span class="sub" id="goalCount"></span></h2>
  <ul id="goalList" class="goals"></ul>
  <div class="row">
    <input id="goalInput" placeholder="목표 추가 (예: 매일 7시 기상)" maxlength="80">
    <button id="bGoalAdd" style="white-space:nowrap">추가</button>
  </div>
  <button id="bGoalClear" class="alt small" style="margin-top:8px">완료한 목표 지우기</button>
</div>

<div class="card">
  <h2>빠른 기록</h2>
  <div class="grid">
    <button id="bWake">☀️ 지금 일어남</button>
    <button id="bSleep">🛏 지금 누움</button>
    <button id="bEx" class="alt">🏃 운동 시작</button>
    <button id="bStudy" class="alt">📚 공부 시작</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input id="steps" type="number" inputmode="numeric" placeholder="오늘 걸음 수">
    <button id="bSteps" class="alt" style="white-space:nowrap">저장</button>
  </div>
</div>

<div class="card">
  <h2>오늘 요약</h2>
  <div id="summary"></div>
</div>

<div class="card">
  <h2>🤖 AI 분석 (최근 14일)</h2>
  <button id="bAI" style="width:100%">분석하기</button>
  <p id="result" class="sub" style="margin-top:10px"></p>
</div>

<div class="card">
  <h2>최근 기록</h2>
  <table><thead><tr><th>날짜</th><th>기상</th><th>취침</th><th>공부</th><th>집중</th><th>운동</th><th>걸음</th></tr></thead><tbody id="hist"></tbody></table>
</div>

<div class="card">
  <h2>설정·백업</h2>
  <input id="code" type="password" placeholder="접속 코드 (Vercel의 ACCESS_CODE와 같게)" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="margin-bottom:8px">
  <div class="grid">
    <button class="alt" id="bExport">내보내기</button>
    <button class="alt" id="bImport">불러오기</button>
  </div>
  <input id="file" type="file" accept="application/json" hidden>
  <p class="sub">기록은 이 기기의 브라우저에 저장돼요. 기기를 바꾸기 전에 내보내기를 해두세요.</p>
</div>

<div class="card">
  <h2>🧪 테스트용 샘플</h2>
  <p class="sub" style="margin-top:0">AI 분석을 바로 써보고 싶을 때, 가짜 14일치 기록을 넣을 수 있어요. 내 진짜 기록은 건드리지 않고, 언제든 지울 수 있어요.</p>
  <div class="grid">
    <button class="alt" id="bSample">샘플 14일 넣기</button>
    <button class="alt" id="bUnsample">샘플 지우기</button>
  </div>
  <p class="sub" id="sampleInfo"></p>
</div>
</main>

<dialog id="dlg">
  <h2>공부 끝! 자가진단</h2>
  <p class="sub" id="dlgInfo"></p>
  <label>집중도 <b id="fv">70</b>%</label>
  <input id="focus" type="range" min="0" max="100" step="5" value="70">
  <p class="sub" style="margin-bottom:4px">부족했던 점</p>
  <textarea id="note" placeholder="예: 폰을 자꾸 봄, 졸림, 시작이 늦음"></textarea>
  <div class="grid" style="margin-top:10px">
    <button class="alt" id="dSkip">건너뛰기</button>
    <button id="dSave">저장</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
